services:
  # FastAPI Backend & ML Engine Service
  - type: web
    name: pl-valuedge-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python scripts/download_database.py && uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PROJECT_NAME
        value: Premier League Valuation Intelligence
      - key: VERSION
        value: 1.0.0
      - key: API_PREFIX
        value: /api
      - key: MODEL_PATH
        value: data/processed/ml/best_model.joblib
      - key: MODEL_VERSION
        value: xgboost-v1
      - key: DATABASE_URL
        value: sqlite:///data/pl_valuation.db
      - key: DATABASE_DOWNLOAD_URL
        sync: false
      - key: CORS_ORIGINS
        value: "https://pl-valuedge-frontend.onrender.com,http://localhost:3000,https://ganeshancs.github.io"

  # React / Vite PWA Frontend Static Site
  - type: web
    name: pl-valuedge-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://pl-valuedge-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
